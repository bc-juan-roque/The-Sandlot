<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commerce Navigation Prototypes</title>
  <style>
/* Review shell for the navigation prototypes (version / variation switcher,
   faux browser bar, review notes, live controls). Not part of the nav itself. */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: #e9e9ec;
  color: #1a1a1a;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ----- Faux browser bar --------------------------------------------------- */
.addr {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  background: #e9e9ec;
  border-bottom: 1px solid #d6d6db;
  font-size: 12.5px;
  color: #444;
}
.addr button {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: #555;
  cursor: pointer;
}
.addr button:hover { background: #dcdce0; }
.url {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 720px;
  height: 26px;
  padding: 0 10px;
  overflow: hidden;
  white-space: nowrap;
  background: #fff;
  border-radius: 7px;
  font-variant-numeric: tabular-nums;
}
.url .lock { flex: none; color: #777; }
.url .host { font-weight: 500; color: #1a1a1a; }
.url .path { color: #555; overflow: hidden; text-overflow: ellipsis; }

/* ----- Stage -------------------------------------------------------------- */
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; }
.device { width: 100%; height: 100%; background: #fff; }
.device iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }

.stage[data-mode="mobile"] { align-items: center; padding: 20px 16px 110px; }
.stage[data-mode="mobile"] .device {
  flex: none;
  width: min(410px, 100%);
  height: min(864px, 100%);
  border: 10px solid #16161a;
  border-radius: 42px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
}
@media (max-width: 430px) {
  .stage[data-mode="mobile"] { padding: 0; }
  .stage[data-mode="mobile"] .device { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
}

/* ----- Version / variation switcher -------------------------------------- */
.proto {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(17, 17, 17, 0.94);
  color: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
  font-size: 12px;
  line-height: 16px;
}
.proto-row { display: flex; align-items: center; gap: 8px; }
.proto-label { color: rgba(255, 255, 255, 0.55); }
.proto-sel {
  height: 24px;
  padding: 0 6px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 6px;
  background: #222;
  color: #fff;
}
.seg { display: flex; gap: 2px; padding: 2px; background: rgba(255, 255, 255, 0.1); border-radius: 7px; }
.seg button {
  min-width: 24px;
  height: 22px;
  padding: 0 8px;
  border: 0;
  border-radius: 5px;
  background: none;
  color: rgba(255, 255, 255, 0.7);
  cursor: pointer;
  transition: background-color 0.3s ease, color 0.3s ease;
}
.seg button:hover { color: #fff; }
.seg button.on { background: #fff; color: #000; }
.rv-toggle {
  margin-left: auto;
  height: 24px;
  padding: 0 10px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 6px;
  background: none;
  color: #fff;
  cursor: pointer;
}
.rv-toggle[aria-pressed="true"] { background: #fff; color: #000; }
.status { max-width: 380px; color: rgba(255, 255, 255, 0.6); font-size: 11.5px; line-height: 15px; }

/* ----- Review notes ------------------------------------------------------- */
.rv-legend {
  position: fixed;
  left: 14px;
  bottom: 138px;
  z-index: 99;
  width: min(400px, calc(100vw - 28px));
  max-height: calc(100vh - 200px);
  overflow-y: auto;
  padding: 14px 16px 16px;
  background: #fff;
  border: 1px solid #d6d6db;
  border-radius: 12px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.16);
  font-size: 12.5px;
  line-height: 17px;
}
.rv-legend h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.02em; color: #666; font-weight: 600; }
.rv-legend ol { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.rv-legend li { display: flex; gap: 10px; }
.rv-legend i {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #1a1a1a;
  color: #fff;
  font-size: 10.5px;
  font-style: normal;
  font-weight: 600;
}
.rv-legend b { font-weight: 600; }
.rv-legend span { color: #555; }

/* ----- Live controls (gear) ----------------------------------------------- */
.acp-root { position: fixed; right: 14px; bottom: 14px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.acp-tab {
  position: relative;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: #111;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
}
.acp-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: #6058ff;
  color: #fff;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}
.acp-panel {
  order: -1;
  width: 320px;
  max-height: calc(100vh - 120px);
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 1px solid #d6d6db;
  border-radius: 12px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
  font-size: 12.5px;
}
.acp-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #ececf0; }
.acp-title { margin: 0; font-size: 13px; font-weight: 600; }
.acp-x { width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: #666; }
.acp-x:hover { background: #f1f1f3; }
.acp-body { flex: 1; overflow-y: auto; padding: 4px 14px 10px; }
.acp-group { margin: 14px 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8a93; }
.acp-row { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; }
.acp-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.acp-val { font-variant-numeric: tabular-nums; color: #666; }
.acp-row input[type="range"] { width: 100%; accent-color: #1a1a1a; }
.acp-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #1a1a1a; }
.acp-foot { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #ececf0; }
.acp-foot button {
  flex: 1;
  height: 30px;
  border: 1px solid #d6d6db;
  border-radius: 7px;
  background: #fff;
  cursor: pointer;
}
.acp-foot .acp-copy:not(:disabled) { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.acp-foot button:disabled { opacity: 0.45; cursor: default; }

@media (max-width: 760px) {
  .proto { right: 14px; }
  .proto-row { flex-wrap: wrap; }
  .acp-root { bottom: auto; top: 46px; }
}

</style>
</head>
<body>
  <!-- Review shell: faux browser bar + the prototype in a frame + version/variation switcher.
       Links look like  #mobile-2/bigcommerce/pricing  (version-variation/page). -->
  <div class="addr" id="addr">
    <button type="button" data-nav="back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <button type="button" data-nav="forward" aria-label="Forward"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <div class="url">
      <svg class="lock" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span class="host">commerce.com</span><span class="path" id="path">/</span>
    </div>
  </div>

  <main class="stage" id="stage" data-mode="desktop">
    <div class="device" id="device">
      <iframe id="frame" title="Navigation prototype"></iframe>
    </div>
  </main>

  <div class="rv-legend" id="legend" hidden></div>

  <div class="proto" id="proto">
    <div class="proto-row">
      <span class="proto-label">Version</span>
      <select class="proto-sel" id="ver" aria-label="Version"></select>
      <span class="proto-label" id="vari-label">Variation</span>
      <div class="seg" id="vari" role="group" aria-label="Variation"></div>
      <button type="button" class="rv-toggle" id="review" aria-pressed="false">Review</button>
    </div>
    <div class="proto-row">
      <span class="proto-label">Page</span>
      <div class="seg" id="pages" role="group" aria-label="Page">
        <button type="button" data-page="commerce">Commerce</button>
        <button type="button" data-page="bigcommerce">BigCommerce</button>
        <button type="button" data-page="feedonomics">Feedonomics</button>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="acp-root" id="acp">
    <button type="button" class="acp-tab" id="acp-tab" aria-label="Open controls" aria-expanded="false">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="acp-badge" id="acp-badge" hidden></span>
    </button>
    <aside class="acp-panel" id="acp-panel" hidden aria-label="Controls">
      <div class="acp-head"><h2 class="acp-title">Controls</h2><button type="button" class="acp-x" id="acp-x" aria-label="Close controls">&times;</button></div>
      <div class="acp-body" id="acp-body"></div>
      <div class="acp-foot">
        <button type="button" class="acp-copy" id="acp-copy" disabled>No changes yet</button>
        <button type="button" class="acp-resetall" id="acp-reset" disabled>Reset all</button>
      </div>
    </aside>
  </div>

  <script>window.__PAGES = {"desktop": "<!doctype html>\n<html lang=\"en\">\n<head>\n<\!--BOOT-->\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Commerce \u00b7 Desktop navigation prototype<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap\" rel=\"stylesheet\">\n  <style>\n/* ==========================================================================\n   Commerce navigation prototype\n   Tokens come from the Multi-Brand [DS] library, \"Brand\" collection, BC mode.\n   ========================================================================== */\n\n:root {\n  --hover-delay: 90ms;\n  --hover-close: 200ms;\n  --switch-slide: 18px;\n  --switch-out: 0.14s;\n  --switch-morph: 420ms;\n  --logo-w: 163px;\n  --nav-gap: 40px;\n  /* Type */\n  --font: \"Host Grotesk\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --type-m: 16px;            /* Type/Font Size/Type M  (main nav) */\n  --type-s: 14px;            /* Type/Font Size/Type S  (menus, sub nav) */\n  --lh-m: 22.4px;\n  --lh-s: 19.6px;\n  --w-regular: 400;\n  --w-medium: 500;\n\n  /* Color */\n  --text: #000;                 /* Type/Color/Primary */\n  --text-tertiary: #667085;     /* Type/Color/Tertiary */\n  --text-inverse: #fff;         /* Type/Color/Inverse */\n  --surface: #fff;              /* Surface/Base */\n  --surface-2: #f2f4f7;         /* Surface/Secondary */\n  --surface-inverse: #000;      /* Surface/Inverse */\n  --border: #d0d5dd;           /* Border/UI/Border 200 */\n  --border-strong: #000;        /* Border/UI/Border Black */\n\n  /* Radius */\n  --r-sm: 2px;                  /* button */\n  --r-md: 8px;                  /* nav item fill */\n  --r-lg: 12px;                 /* icon tile */\n  --r-xl: 16px; n  isolation: isolate;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 8px 10px;\n  border: 0;\n  background: none;\n  border-radius: var(--r-md);\n  cursor: pointer;\n  white-space: nowrap;\n  font-size: inherit;\n  line-height: inherit;\n}\n.nav-item::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index: -1;\n  border-radius: inherit;\n  background: var(--surface-2);\n  opacity: 0;\n  transform: scale(0.94);\n  transition: opacity var(--t-fill) var(--ease), transform 0.45s var(--ease-out);\n}\n.nav-item:hover::before,\n.nav-item:focus-visible::before,\n.nav-item[aria-expanded=\"true\"]::before,\n.nav-item[data-current]::before {\n  opacity: 1;\n  transform: scale(1);\n}\n.nav-item__label {\n  transition: font-weight 0.3s var(--ease);\n}\n.nav-item[aria-expanded=\"true\"] .nav-item__label,\n.nav-item[data-current] .nav-item__label { font-weight: var(--w-medium); }\n\n.chev {\n  width: 12px;\n  height: 12px;\n  opacity: 0.5;\n  transition: transform 0.5s var(--ease-out), opacity var(--t-fill) var(--ease);\n}\n.nav-item:hover .chev { opacity: 0.8; }\n.nav-item[aria-expanded=\"true\"] .chev { transform: rotate(180deg); opacity: 0.8; }\n\n/* Variation 2: no \"open\" look on the button (container fill and chevron); hover still shows the fill */\nbody[data-variant=\"2\"] .nav-item[aria-expanded=\"true\"]:not(:hover):not(:focus-visible):not([data-current])::before {\n  opacity: 0;\n  transform: scale(0.94);\n}\nbody[data-variant=\"2\"] .nav-item[aria-expanded=\"true\"] .chev { transform: none; opacity: 0.5; }\nbody[data-variant=\"2\"] .nav-item[aria-expanded=\"true\"]:hover .chev { opacity: 0.8; }\n/* Variation 2: while a menu is open, its button reaches down toward the menu so the pointer can cross the gap */\nbody[data-variant=\"2\"] .nav-item[data-menu][aria-expanded=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  right: 0;\n  top: 100%;\n  height: 40px;\n}\n\n.nav-slot { position: relative; }\n\n/* ==========================================================================\n   Buttons (library Button, BC mode)\n   ========================================================================== */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  padding: 12px 20px;\n  border: 1px solid transparent;\n  border-radius: var(--r-sm);\n  font-size: var(--type-m);\n  line-height: var(--lh-m);\n  white-space: nowrap;\n  cursor: pointer;\n  transition: background-color 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease);\n}\n.btn--sm { padding: 8px 12px; font-size: var(--type-s); line-height: var(--lh-s); }\n\n.btn--primary { background: var(--surface-inverse); color: var(--text-inverse); }\n.btn--primary:hover { background: #1f1f1f; }\n\n.btn--secondary { border-color: var(--border-strong); color: var(--text); background: transparent; }\n.btn--secondary:hover { background: var(--surface-2); }\n\n.btn--text { padding: 0; border: 0; background: none; color: var(--text); }\n.btn--text svg {\n  width: 11px;\n  height: 11px;\n  transition: transform 0.5s var(--ease-out);\n}\n.btn--text:hover svg { transform: translateX(4px); }\n\n/* ==========================================================================\n   Menus\n   ========================================================================== */\n.menu {\n  position: absolute;\n  z-index: 80;\n  width: max-content;\n  max-width: calc(100vw - 2 * var(--gutter));\n  max-height: var(--max-h, none);\n  overflow-x: hidden;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  scrollbar-width: thin;\n  padding: 24px 28px;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-xl);\n  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);\n  font-size: var(--type-s);\n  line-height: var(--lh-s);\n\n  opacity: 0;\n  visibility: hidden;\n  pointer-events: none;\n  transform: translate(var(--shift, 0px), -10px) scale(0.985);\n  transform-origin: 50% 0;\n  transition:\n    opacity 0.38s var(--ease),\n    transform var(--t-menu) var(--ease-out),\n    visibility 0s linear var(--t-menu);\n}\n/* Variation 2, switching menus: the old dropdown's box hands over to the new one (nav.js);\n   only its contents fade out */\n.menu.is-morph-out {\n  z-index: 79;\n  background: transparent;\n  border-color: transparent;\n  box-shadow: none;\n  pointer-events: none;\n  transition: none !important;\n}\n\n.menu.is-open {\n  opacity: 1;\n  visibility: visible;\n  pointer-events: auto;\n  transform: translate(var(--shift, 0px), 0) scale(1);\n  transition:\n    opacity 0.45s var(--ease),\n    transform var(--t-menu) var(--ease-out),\n    visibility 0s;\n}\n\n/* Commerce bar menus: left edge lines up with their nav item (set in nav.js), 16px under the bar */\n.menu--end { top: calc(100% + 16px); left: var(--left, 0px); }\n/* Sub bar menus: left-aligned under their trigger, 8px under the bar */\n.menu--sub { top: calc(100% + 16px); left: -10px; }\n\n.menu__cols { display: flex; gap: var(--gap, 48px); align-items: flex-start; }\n.menu__cols > * { flex: none; }\n.menu .link, .menu .btn, .menu p { white-space: nowrap; }\n\n/* Content rises in, one block after another */\n.menu.is-open .reveal {\n  animation: rise 0.7s var(--ease-out) backwards;\n  animation-delay: calc(var(--d, 0) * 70ms + 90ms);\n}\n@keyframes rise {\n  from { opacity: 0; transform: translateY(10px); }\n  to   { opacity: 1; transform: none; }\n}\n\n/* Labels */\n.eyebrow {\n  color: var(--text-tertiary);\n  margin-bottom: 20px;\n}\n.group__title { font-weight: var(--w-medium); margin-bottom: 16px; }\n\n.group-row { display: flex; gap: var(--gap, 48px); }\n\n/* Lists */\n.list { display: flex; flex-direction: column; gap: 12px; }\n/* Capabilities lists (Industries, Teams): plain lists, no side border */\n.list--bordered { border-left: 0; padding-left: 0; }\n\n/* ----- Sub-nav links: bold + nudge right + arrow (Lattice-style) --------- */\n.link {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  min-height: 20px;\n  border-radius: 4px;\n}\n.link__label {\n  display: inline-block;\n  font-weight: var(--w-regular);\n  transition:\n    transform 0.55s var(--ease-out),\n    font-weight 0.4s var(--ease);\n}\n.link__label::after {\n  content: \"\u2192\";\n  display: inline-block;\n  margin-left: 0.45em;\n  opacity: 0;\n  filter: blur(2px);\n  transform: translateX(-30%);\n  transition:\n    opacity 0.4s var(--ease-soft),\n    filter 0.4s var(--ease-soft),\n    transform 0.6s var(--ease-out);\n}\n.link:hover .link__label,\n.link:focus-visible .link__label {\n  font-weight: var(--w-medium);\n  transform: translateX(4px);\n}\n.link:hover .link__label::after,\n.link:focus-visible .link__label::after {\n  opacity: 0.45;\n  filter: blur(0);\n  transform: none;\n}\n.link--logo img { flex: none; transition: transform 0.55s var(--ease-out); }\n.link--logo:hover img { transform: translateX(4px); }\n\n/* ----- Focus: hovering one dropdown item quietly dims the rest ------------\n   An \"item\" is a link, a product header, a standalone text button, or a whole\n   card / strip (cards are one big link, so they count as one item).\n   Three timings, so it feels attentive going in and unhurried coming out:\n   1. Dimming the others:      fast, no delay\n   2. The hovered item:        brightens quickly\n   3. Everything returning:    waits a beat (also covers the gap between two\n                               items), then fades back slowly\n   Tune --focus-dim, --focus-return-delay and --focus-return-time to taste. */\n:root {\n  --focus-dim: 0.4;\n  --focus-return-delay: 0.32s;\n  --focus-return-time: 1s;\n}\n\n/* 3. Resting state: the slow, delayed return */\n.menu .link,\n.menu .product__head,\n.menu .btn--text:not([data-in-card]),\n.menu .promo,\n.menu .strip,\n.menu .group__title {\n  transition:\n    opacity var(--focus-return-time) var(--ease-soft) var(--focus-return-delay),\n    background-color 0.45s var(--ease),\n    color 0.35s var(--ease);\n}\n\n/* 1. The others dim right away */\n.menu:has(:is(.link, .product__head, .btn--text:not([data-in-card]), .promo, .strip):is(:hover, :focus-visible, :has(:focus-visible)))\n  :is(.link, .product__head, .btn--text:not([data-in-card]), .promo, .strip, .group__title):not(:is(:hover, :focus-visible, :has(:focus-visible))) {\n  opacity: var(--focus-dim);\n  transition:\n    opacity 0.45s var(--ease) 0s,\n    background-color 0.45s var(--ease),\n    color 0.35s var(--ease);\n}\n\n/* A parent stays lit while one of its own items is focused:\n   BigCommerce / Feedonomics while their features are hovered,\n   Industries / Teams while their links are hovered */\n.menu.menu.menu .product:has(:is(:hover, :focus-visible)) > .product__head,\n.menu.menu.menu .group:has(:is(:hover, :focus-visible)) > .group__title {\n  opacity: 1 !important;\n  transition: opacity 0.3s var(--ease) 0s !important;\n}\n\n/* 2. The hovered item comes up to full strength promptly */\n.menu :is(.link, .product__head, .btn--text:not([data-in-card]), .promo, .strip):is(:hover, :focus-visible, :has(:focus-visible)) {\n  transition:\n    opacity 0.3s var(--ease) 0s,\n    background-color 0.45s var(--ease),\n    color 0.35s var(--ease);\n}\n\n.tag {\n  padding: 1px 6px;\n  border-radius: 4px;\n  background: var(--surface-2);\n  color: var(--text-tertiary);\n}\n\n/* ----- Product block (BigCommerce / Feedonomics) ------------------------- */\n.product-row { display: flex; gap: 48px; }\n.product { min-width: 0; }\n.product__head { display: flex; align-items: center; gap: 12px; }\n.tile {\n  flex: none;\n  display: grid;\n  place-items: center;\n  width: 40px;\n  height: 40px;\n  border-radius: var(--r-lg);\n  background: var(--surface-inverse);\n  color: var(--text-inverse);\n  transition: transform 0.6s var(--ease-out);\n}\n.tile svg { width: 20px; height: 20px; }\n.product__text { display: flex; flex-direction: column; gap: 2px; }\n/* Larger items: only the arrow appears. No weight change, no shift. */\n.product__name {\n  font-weight: var(--w-medium);\n}\n.product__name::after {\n  content: \"\u2192\";\n  display: inline-block;\n  margin-left: 0.5em;\n  opacity: 0;\n  filter: blur(2px);\n  transform: translateX(-30%);\n  transition:\n    opacity 0.4s var(--ease-soft),\n    filter 0.4s var(--ease-soft),\n    transform 0.6s var(--ease-out);\n}\n.product__head:hover .product__name::after,\n.product__head:focus-visible .product__name::after {\n  opacity: 0.45;\n  filter: blur(0);\n  transform: none;\n}\n.product__tag { color: var(--text-tertiary); }\n\n/* Connector tree: a quiet line from the tile down to each feature */\n.tree { display: flex; flex-direction: column; padding-top: 18px; }\n.tree li { position: relative; padding: 7px 0 7px 44px; }\n.tree li::before,\n.tree li::after {\n  content: \"\";\n  position: absolute;\n  left: 19.25px;\n}\n.tree li::before {\n  top: 0;\n  bottom: 0;\n  border-left: 1.5px solid var(--border);\n}\n.tree li:first-child::before { top: -18px; }\n.tree li:last-child::before { bottom: auto; height: calc(50% - 12px); }\n.tree li:first-child:last-child::before { height: calc(50% - 12px + 18px); }\n.tree li::after {\n  top: calc(50% - 12px);\n  width: 12px;\n  height: 12px;\n  border-left: 1.5px solid var(--border);\n  border-bottom: 1.5px solid var(--border);\n  border-bottom-left-radius: 12px;\n}\n\n/* Strip along the bottom of the Solutions menu */\n.strip {\n  position: relative;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  margin-top: 28px;\n  padding: 14px 20px;\n  background: var(--surface-2);\n  border-radius: 14px;\n}\n.strip__text { display: flex; align-items: center; gap: 8px; }\n.strip__title { font-weight: var(--w-medium); font-size: 15px; }\n\n/* Cards inside menus */\n.card {\n  background: var(--surface-2);\n  border-radius: var(--r-xl);\n  padding: 20px;\n}\n.promo {\n  position: relative;\n  cursor: pointer;\n  display: flex;\n  flex-direction: column;\n  justify-content: flex-end;\n  align-self: stretch;\n  width: 260px;\n  min-height: 160px;\n  gap: 8px;\n  padding: 20px;\n  background: var(--surface-2);\n  border-radius: var(--r-xl);\n}\n.promo .btn { align-self: flex-start; }\n\n/* Whole-card links: the link's ::after stretches over the entire card */\n.promo .btn--text::after,\n.strip__title::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: inherit;\n}\n.promo:hover,\n.strip:hover { background: #e8ecf2; }\n.promo:hover .btn--text svg,\n.strip:hover .btn--text svg { transform: translateX(4px); }\n.promo a:focus-visible,\n.strip a:focus-visible { outline: none; }\n.promo:has(:focus-visible),\n.strip:has(:focus-visible) { outline: 2px solid var(--text); outline-offset: 2px; }\n.promo__eyebrow { color: var(--text-tertiary); }\n.promo__text { font-weight: var(--w-medium); white-space: normal !important; }\n\n/* ==========================================================================\n   Wireframe page (after Josh's prototype)\n   ========================================================================== */\n.page {\n  display: flex;\n  flex-direction: column;\n  gap: 72px;\n  max-width: 1440px;\n  margin: 0 auto;\n  padding: 56px var(--gutter) 96px;\n}\n.wf-title {\n  margin: 0 0 24px;\n  font-size: 56px;\n  line-height: 1.05;\n  font-weight: var(--w-medium);\n  letter-spacing: -0.01em;\n}\n.wf-line { height: 12px; border-radius: 6px; background: var(--wf); margin: 0 0 12px; }\n.wf-img {\n  min-height: 240px;\n  border: 1.5px solid var(--wf);\n  border-radius: 8px;\n  background: var(--wf-light);\n}\n.wf-img.sm { min-height: 150px; margin-bottom: 18px; }\n.wf-btns { display: flex; gap: 12px; margin-top: 22px; }\n.wf-btns.center { justify-content: center; }\n.wf-btn { width: 132px; height: 42px; border-radius: 6px; background: var(--wf-dark); }\n.wf-btn.ghost { background: none; border: 1.5px solid var(--wf-dark); }\n.wf-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }\n.wf-hero .wf-img { min-height: 340px; }\n.wf-logos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; }\n.wf-logo { height: 36px; border-radius: 6px; background: var(--wf); }\n.wf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }\n.wf-card { border: 1.5px solid var(--wf); border-radius: 10px; padding: 20px; background: #fff; }\n.wf-split { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }\n.wf-split .wf-img { min-height: 300px; }\n.wf-band {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  padding: 48px 24px;\n  border: 1.5px solid var(--wf);\n  border-radius: 12px;\n  background: #fff;\n}\n.wf-band .wf-line { margin-left: auto; margin-right: auto; }\n.wf-footer {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 32px;\n  padding-top: 40px;\n  border-top: 1.5px solid var(--wf);\n}\n\n/* Prototype scaffolding: not part of the design */\n.proto-switch {\n  position: fixed;\n  left: 20px;\n  bottom: 20px;\n  z-index: 90;\n  display: flex;\n  gap: 2px;\n  padding: 4px;\n  background: rgba(17, 17, 17, 0.92);\n  border-radius: 999px;\n  font-size: 12px;\n  line-height: 16px;\n}\n.proto-switch a {\n  padding: 6px 12px;\n  border-radius: 999px;\n  color: rgba(255, 255, 255, 0.7);\n  transition: background-color 0.4s var(--ease), color 0.4s var(--ease);\n}\n.proto-switch a:hover { color: #fff; }\n.proto-switch a[aria-current=\"page\"] { background: #fff; color: #000; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-delay: 0s !important;\n    transition-duration: 0.01ms !important;\n    transition-delay: 0s !important;\n  }\n}\n\n<\/style>\n<\/head>\n<body data-page=\"commerce\">\n\n  <\!-- Icon sprite -->\n  <svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n    <symbol id=\"i-chevron\" vi pan class=\"nav-item__label\">Pricing<\/span><\/a><\/li>\n        <li class=\"nav-slot\">\n          <button class=\"nav-item\" type=\"button\" aria-expanded=\"false\" aria-controls=\"menu-fdx-resources\" data-menu=\"menu-fdx-resources\">\n            <span class=\"nav-item__label\">Resources<\/span>\n            <svg class=\"chev\" aria-hidden=\"true\"><use href=\"#i-chevron\"/><\/svg>\n          <\/button>\n          <div class=\"menu menu--sub\" id=\"menu-fdx-resources\" style=\"--w:700px\" role=\"region\" aria-label=\"Resources\">\n            <div class=\"menu__cols\" style=\"--gap:48px\">\n              <div class=\"group reveal\" style=\"--d:0\">\n                <p class=\"group__title\">Learn<\/p>\n                <ul class=\"list\">\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">Feed Management Guides<\/span><\/a><\/li>\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">Case Studies<\/span><\/a><\/li>\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">Webinars<\/span><\/a><\/li>\n                <\/ul>\n              <\/div>\n              <div class=\"group reveal\" style=\"--d:1\">\n                <p class=\"group__title\">Get Help<\/p>\n                <ul class=\"list\">\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">FeedSupport\u2122<\/span><\/a><\/li>\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">Help Center<\/span><\/a><\/li>\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">Contact<\/span><\/a><\/li>\n                <\/ul>\n              <\/div>\n              <div class=\"group reveal\" style=\"--d:2\">\n                <p class=\"group__title\">Build<\/p>\n                <ul class=\"list\">\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">Developer Docs<\/span><\/a><\/li>\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">API Reference<\/span><\/a><\/li>\n                  <li><a class=\"link\" href=\"#\"><span class=\"link__label\">Supported Integrations<\/span><\/a><\/li>\n                <\/ul>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/li>\n      <\/ul>\n      <div class=\"sub-bar__right\">\n        <a class=\"nav-item\" href=\"#\"><span class=\"nav-item__label\">Login<\/span><\/a>\n        <a class=\"btn btn--primary btn--sm\" href=\"#\"><span>Get a demo<\/span><\/a>\n      <\/div>\n    <\/nav>\n  <\/div>\n\n  <\!-- ============ PAGE (wireframe, like Josh's prototype) ============ -->\n  <main class=\"page\" id=\"page\">\n    <section class=\"wf-hero\">\n      <div>\n        <h1 class=\"wf-title\" data-page-title>Commerce<\/h1>\n        <div class=\"wf-line\" style=\"width:90%\"><\/div>\n        <div class=\"wf-line\" style=\"width:75%\"><\/div>\n        <div class=\"wf-line\" style=\"width:60%\"><\/div>\n        <div class=\"wf-btns\"><div class=\"wf-btn\"><\/div><div class=\"wf-btn ghost\"><\/div><\/div>\n      <\/div>\n      <div class=\"wf-img\"><\/div>\n    <\/section>\n    <section class=\"wf-logos\">\n      <div class=\"wf-logo\"><\/div><div class=\"wf-logo\"><\/div><div class=\"wf-logo\"><\/div>\n      <div class=\"wf-logo\"><\/div><div class=\"wf-logo\"><\/div><div class=\"wf-logo\"><\/div>\n    <\/section>\n    <section class=\"wf-grid\">\n      <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:85%\"><\/div><\/div>\n      <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:85%\"><\/div><\/div>\n      <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:85%\"><\/div><\/div>\n    <\/section>\n    <section class=\"wf-split\">\n      <div class=\"wf-img\"><\/div>\n      <div>\n        <div class=\"wf-line\" style=\"width:45%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:95%\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div>\n        <div class=\"wf-btns\"><div class=\"wf-btn\"><\/div><\/div>\n      <\/div>\n    <\/section>\n    <section class=\"wf-split rev\">\n      <div>\n        <div class=\"wf-line\" style=\"width:45%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:95%\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div>\n        <div class=\"wf-btns\"><div class=\"wf-btn\"><\/div><\/div>\n      <\/div>\n      <div class=\"wf-img\"><\/div>\n    <\/section>\n    <section class=\"wf-grid\">\n      <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:85%\"><\/div><\/div>\n      <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:85%\"><\/div><\/div>\n      <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:100%\"><\/div><div class=\"wf-line\" style=\"width:85%\"><\/div><\/div>\n    <\/section>\n    <section class=\"wf-band\">\n      <div class=\"wf-line\" style=\"width:40%\"><\/div><div class=\"wf-line\" style=\"width:60%\"><\/div>\n      <div class=\"wf-btns center\"><div class=\"wf-btn\"><\/div><\/div>\n    <\/section>\n    <footer class=\"wf-footer\">\n      <div><div class=\"wf-line\" style=\"width:50%\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:60%\"><\/div><div class=\"wf-line\" style=\"width:65%\"><\/div><div class=\"wf-line\" style=\"width:55%\"><\/div><\/div>\n      <div><div class=\"wf-line\" style=\"width:50%\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:60%\"><\/div><div class=\"wf-line\" style=\"width:65%\"><\/div><div class=\"wf-line\" style=\"width:55%\"><\/div><\/div>\n      <div><div class=\"wf-line\" style=\"width:50%\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:60%\"><\/div><div class=\"wf-line\" style=\"width:65%\"><\/div><div class=\"wf-line\" style=\"width:55%\"><\/div><\/div>\n      <div><div class=\"wf-line\" style=\"width:50%\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:60%\"><\/div><div class=\"wf-line\" style=\"width:65%\"><\/div><div class=\"wf-line\" style=\"width:55%\"><\/div><\/div>\n    <\/footer>\n  <\/main>\n\n  <\!-- Prototype scaffolding: jump between page states -->\n  <div class=\"proto-switch\" role=\"group\" aria-label=\"Prototype page\">\n    <a href=\"#/commerce\" data-route=\"commerce\">Commerce<\/a>\n    <a href=\"#/bigcommerce\" data-route=\"bigcommerce\">BigCommerce<\/a>\n    <a href=\"#/feedonomics\" data-route=\"feedonomics\">Feedonomics<\/a>\n  <\/div>\n\n  <script>\n/* Commerce navigation prototype\n   Everything visual lives in CSS. This file handles:\n   - click to open / close menus (one at a time)\n   - Esc, outside click and scrim click to close\n   - keeping wide menus inside the viewport\n   - a page for every nav and sub-nav item, titled with the item's label\n   Routes look like  #/<section>  or  #/<section>/<item>\n   where section is commerce, bigcommerce or feedonomics.\n*/\n(() => {\n  // Review shell: start on the page it asks for\n  if (window.__BOOT && window.__BOOT.hash) location.hash = window.__BOOT.hash;\n\n  const body = document.body;\n  // Variation 1: click only. Variation 2: once a menu is open, hovering another menu button switches to it.\n  // The review shell picks the variation; opened on its own the page is variation 1.\n  body.dataset.variant = (window.__BOOT && window.__BOOT.v) === '2' ? '2' : '1';\n  window.__navSetVariant = (v) => { close(); body.dataset.variant = v === '2' ? '2' : '1'; };\n  const triggers = [...document.querySelectorAll('[data-menu]')];\n  const switchLinks = [...document.querySelectorAll('.proto-switch a')];\n  const heading = document.querySelector('[data-page-title]');\n  const solutionsTrigger = document.querySelector('[data-menu=\"menu-solutions\"]');\n\n  const SECTIONS = { commerce: 'Commerce', bigcommerce: 'BigCommerce', feedonomics: 'Feedonomics' };\n\n  /* ---- Page registry ---------------------------------------------------- */\n  const clean = (s) => s.replace(/[\u2726\u2122]/g, '').replace(/\\s+/g, ' ').trim();\n  const slugify = (s) => clean(s).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');\n  const titleize = (slug) => slug.split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');\n\n  const sectionOf = (el) => {\n    const tagged = el.closest('[data-section]');\n    if (tagged) return tagged.dataset.section;\n    const sub = el.closest('.sub-bar');\n    return sub ? sub.dataset.brand : 'commerce';\n  };\n  const labelOf = (el) => {\n    const inner = el.querySelector('.link__label, .nav-item__label') || el.querySelector('span');\n    return (inner || el).textContent;\n  };\n\n  /* key (\"section/slug\") -> { title, owner }.  owner is the top-level nav item\n     that \"contains\" the page, so it can be marked as current. */\n  const pages = new Map();\n  const register = (section, label, owner, slugOverride) => {\n    const key = `${section}/${slugOverride || slugify(label)}`;\n    const existing = pages.get(key);\n    if (!existing) pages.set(key, { title: clean(label), owner });\n    // Prefer the more specific parent: a sub bar item over the Commerce bar's Solutions\n    else if (owner && owner !== solutionsTrigger && (!existing.owner || existing.owner === solutionsTrigger)) existing.owner = owner;\n    return key;\n  };\n\n  // Menu triggers (Solutions, Learning, Product Features...) get hub pages too\n  triggers.forEach((t) => register(sectionOf(t), labelOf(t), t));\n\n  // Every placeholder link becomes a real route\n  document.querySelectorAll('.commerce-bar a[href=\"#\"], .sub-bar a[href=\"#\"]').forEach((a) => {\n    const section = sectionOf(a);\n    const label = a.dataset.title || labelOf(a);\n    const menu = a.closest('.menu');\n    const owner = menu\n      ? document.querySelector(`[data-menu=\"${menu.id}\"]`)\n      : (a.classList.contains('nav-item') ? a : null);\n    const key = register(section, label, owner, a.dataset.slug);\n    a.setAttribute('href', `#/${key}`);\n  });\n\n  /* Links go medium weight on hover, which is slightly wider. Reserve that width up\n     front so nothing in a menu shifts, grows or reflows when you hover. */\n  function lockLabelWidths() {\n    const labels = [...document.querySelectorAll('.menu .link__label')];\n    labels.forEach((l) => { l.style.minWidth = ''; });\n    // measure everything first, then write, so we don't thrash layout\n    const widths = labels.map((l) => {\n      l.style.fontWeight = 'var(--w-medium)';\n      const w = l.getBoundingClientRect().width;\n      l.style.fontWeight = '';\n      return w;\n    });\n    labels.forEach((l, i) => { l.style.minWidth = `${Math.ceil(widths[i])}px`; });\n  }\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(lockLabelWidths);\n  lockLabelWidths();\n\n  /* ---- Menus ------------------------------------------------------------ */\n  let openTrigger = null;\n  const panelOf = (t) => document.getElementById(t.dataset.menu);\n\n  /* Keep a menu at least 32px from either edge of the viewport */\n  function fit(panel) {\n    panel.style.setProperty('--shift', '0px');\n    / dow.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  /* Variation 2: moving between two open menus. The dropdown itself glides and resizes from the\n     old menu's box to the new one's, while the old contents fade out toward where you came from\n     and the new contents fade in from the direction you are heading. */\n  function morphSwitch(prev, trigger, panel) {\n    const prevPanel = panelOf(prev);\n    const dx = Math.sign(trigger.getBoundingClientRect().left - prev.getBoundingClientRect().left) || 1;\n    const dist = cssNum('--switch-slide', 18);\n    const morph = cssNum('--switch-morph', 420);\n    const out = cssNum('--switch-out', 0.14) * 1000;\n\n    const from = prevPanel.getBoundingClientRect();            // where the dropdown is now\n\n    // Put the new menu in its resting open state to find out where and how big it is\n    panel.style.transition = 'none';\n    fit(panel);\n    panel.classList.add('is-open');\n    const to = panel.getBoundingClientRect();\n    const shift = parseFloat(panel.style.getPropertyValue('--shift')) || 0;\n    void panel.offsetWidth;\n\n    // Old menu: its box disappears (the new menu's box takes over from the same spot), its contents fade out\n    prev.setAttribute('aria-expanded', 'false');\n    prevPanel.classList.add('is-morph-out');\n    const prevCols = prevPanel.querySelector('.menu__cols');\n    const fadeOut = prevCols.animate(\n      [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: `translateX(${-dx * dist}px)` }],\n      { duration: out, easing: 'cubic-bezier(.4, 0, 1, 1)', fill: 'forwards' }\n    );\n    // The old box follows the new one (clipping its contents) so nothing is left hanging outside it\n    const m = new DOMMatrix(getComputedStyle(prevPanel).transform);\n    prevPanel.style.overflow = 'hidden';\n    const ease = 'cubic-bezier(.22, 1, .36, 1)';\n    const prevBox = prevPanel.animate([\n      { transform: `translate(${m.e}px, ${m.f}px)`, width: `${from.width}px`, hei nslate(var(--shift, 0px), 0) scale(1);\n  transition:\n    opacity 0.45s var(--ease),\n    transform var(--t-menu) var(--ease-out),\n    visibility 0s;\n}\n\n/* Commerce bar menus: left edge lines up with their nav item (set in nav.js), 16px under the bar */\n.menu--end { top: calc(100% + 16px); left: var(--left, 0px); }\n/* Sub bar menus: left-aligned under their trigger, 8px under the bar */\n.menu--sub { top: calc(100% + 16px); left: -10px; }\n\n.menu__cols { display: flex; gap: var(--gap, 48px); align-items: flex-start; }\n.menu__cols > * { flex: none; }\n.menu .link, .menu .btn, .menu p { white-space: nowrap; }\n\n/* Content rises in, one block after another */\n.menu.is-open .reveal {\n  animation: rise 0.7s var(--ease-out) backwards;\n  animation-delay: calc(var(--d, 0) * 70ms + 90ms);\n}\n@keyframes rise {\n  from { opacity: 0; transform: translateY(10px); }\n  to   { opacity: 1; transform: none; }\n}\n\n/* Labels */\n.eyebrow {\n  color: var(--text-tertiary);\n  margin-bottom: 20px;\n}\n.group__title { font-weight: var(--w-medium); margin-bottom: 16px; }\n\n.group-row { display: flex; gap: var(--gap, 48px); }\n\n/* Lists */\n.list { display: flex; flex-direction: column; gap: 12px; }\n/* Capabilities lists (Industries, Teams): plain lists, no side border */\n.list--bordered { border-left: 0; padding-left: 0; }\n\n/* ----- Sub-nav links: bold + nudge right + arrow (Lattice-style) --------- */\n.link {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  min-height: 20px;\n  border-radius: 4px;\n}\n.link__label {\n  display: inline-block;\n  font-weight: var(--w-regular);\n  transition:\n    transform 0.55s var(--ease-out),\n    font-weight 0.4s var(--ease);\n}\n.link__label::after {\n  content: \"\u2192\";\n  display: inline-block;\n  margin-left: 0.45em;\n  opacity: 0;\n  filter: blur(2px);\n  transform: translateX(-30%);\n  transition:\n    opacity 0.4s var(--ease-soft),\n    filter 0.4s var(--ease-soft),\n    transform 0.6s var(--ease-out);\n}\n.link:hover .link__label,\n.link:focus-visible .link__label {\n  font-weight: var(--w-medium);\n  transform: translateX(4px);\n}\n.link:hover .link__label::after,\n.link:focus-visible .link__label::after {\n  opacity: 0.45;\n  filter: blur(0);\n  transform: none;\n}\n.link--logo img { flex: none; transition: transform 0.55s var(--ease-out); }\n.link--logo:hover img { transform: translateX(4px); }\n\n/* ----- Focus: hovering one dropdown item quietly dims the rest ------------\n   An \"item\" is a link, a product header, a standalone text button, or a whole\n   card / strip (cards are one big link, so they count as one item).\n   Three timings, so it feels attentive going in and unhurried coming out:\n   1. Dimming the others:      fast, no delay\n   2. The hovered item:        brightens quickly\n   3. Everything returning:    waits a beat (also covers the gap between two\n                               items), then fades back slowly\n   Tune --focus-dim, --focus-return-delay and --focus-return-time to taste. */\n:root {\n  --focus-dim: 0.4;\n  --focus-return-delay: 0.32s;\n  --focus-return-time: 1s;\n}\n\n/* 3. Resting state: the slow, delayed return */\n.menu .link,\n.menu .product__head,\n.menu .btn--text:not([data-in-card]),\n.menu .promo,\n.menu .strip,\n.menu .group__title {\n  transition:\n    opacity var(--focus-return-time) var(--ease-soft) var(--focus-return-delay),\n    background-color 0.45s var(--ease),\n    color 0.35s var(--ease);\n}\n\n/* 1. The others dim right away */\n.menu:has(:is(.link, .product__head, .btn--text:not([data-in-card]), .promo, .strip):is(:hover, :focus-visible, :has(:focus-visible)))\n  :is(.link, .product__head, .btn--text:not([data-in-card]), .promo, .strip, .group__title):not(:is(:hover, :focus-visible, :has(:focus-visible))) {\n  opacity: var(--focus-dim);\n  transition:\n    opacity 0.45s var(--ease) 0s,\n    background-color 0.45s var(--ease),\n    color 0.35s var(--ease);\n}\n\n/* A parent stays lit while one of its own items is focused:\n   BigCommerce / Feedonomics while their features are hovered,\n   Industries / Teams while their links are hovered */\n.menu.menu.menu .product:has(:is(:hover, :focus-visible)) > .product__head,\n.menu.menu.menu .group:has(:is(:hover, :focus-visible)) > .group__title {\n  opacity: 1 !important;\n  transition: opacity 0.3s var(--ease) 0s !important;\n}\n\n/* 2. The hovered item comes up to full strength promptly */\n.menu :is(.link, .product__head, .btn--text:not([data-in-card]), .promo, .strip):is(:hover, :focus-visible, :has(:focus-visible)) {\n  transition:\n    opacity 0.3s var(--ease) 0s,\n    background-color 0.45s var(--ease),\n    color 0.35s var(--ease);\n}\n\n.tag {\n  padding: 1px 6px;\n  border-radius: 4px;\n  background: var(--surface-2);\n  color: var(--text-tertiary);\n}\n\n/* ----- Product block (BigCommerce / Feedonomics) ------------------------- */\n.product-row { display: flex; gap: 48px; }\n.product { min-width: 0; }\n.product__head { display: flex; align-items: center; gap: 12px; }\n.tile {\n  flex: none;\n  display: grid;\n  place-items: center;\n  width: 40px;\n  height: 40px;\n  border-radius: var(--r-lg);\n  background: var(--surface-inverse);\n  color: var(--text-inverse);\n  transition: transform 0.6s var(--ease-out);\n}\n.tile svg { width: 20px; height: 20px; }\n.product__text { display: flex; flex-direction: column; gap: 2px; }\n/* Larger items: only the arrow appears. No weight change, no shift. */\n.product__name {\n  font-weight: var(--w-medium);\n}\n.product__name::after {\n  content: \"\u2192\";\n  display: inline-block;\n  margin-left: 0.5em;\n  opacity: 0;\n  filter: blur(2px);\n  transform: translateX(-30%);\n  transition:\n    opacity 0.4s var(--ease-soft),\n    filter 0.4s var(--ease-soft),\n    transform 0.6s var(--ease-out);\n}\n.product__head:hover .product__name::after,\n.product__head:focus-visible .product__name::after {\n  opacity: 0.45;\n  filter: blur(0);\n  transform: none;\n}\n.product__tag { color: var(--text-tertiary); }\n\n/* Connector tree: a quiet line from the tile down to each feature */\n.tree { display: flex; flex-direction: column; padding-top: 18px; }\n.tree li { position: relative; padding: 7px 0 7px 44px; }\n.tree li::before,\n.tree li::after {\n  content: \"\";\n  position: absolute;\n  left: 19.25px;\n}\n.tree li::before {\n  top: 0;\n  bottom: 0;\n  border-left: 1.5px solid var(--border);\n}\n.tree li:first-child::before { top: -18px; }\n.tree li:last-child::before { bottom: auto; height: calc(50% - 12px); }\n.tree li:first-child:last-child::before { height: calc(50% - 12px + 18px); }\n.tree li::after {\n  top: calc(50% - 12px);\n  width: 12px;\n  height: 12px;\n  border-left: 1.5px solid var(--border);\n  border-bottom: 1.5px solid var(--border);\n  border-bottom-left-radius: 12px;\n}\n\n/* Strip along the bottom of the Solutions menu */\n.strip {\n  position: relative;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  margin-top: 28px;\n  padding: 14px 20px;\n  background: var(--surface-2);\n  border-radius: 14px;\n}\n.strip__text { display: flex; align-items: center; gap: 8px; }\n.strip__title { font-weight: var(--w-medium); font-size: 15px; }\n\n/* Cards inside menus */\n.card {\n  background: var(--surface-2);\n  border-radius: var(--r-xl);\n  padding: 20px;\n}\n.promo {\n  position: relative;\n  cursor: pointer;\n  display: flex;\n  flex-direction: column;\n  justify-content: flex-end;\n  align-self: stretch;\n  width: 260px;\n  min-height: 160px;\n  gap: 8px;\n  padding: 20px;\n  background: var(--surface-2);\n  border-radius: var(--r-xl);\n}\n.promo .btn { align-self: flex-start; }\n\n/* Whole-card links: the link's ::after stretches over the entire card */\n.promo .btn--text::after,\n.strip__title::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: inherit;\n}\n.promo:hover,\n.strip:hover { background: #e8ecf2; }\n.promo:hover .btn--text svg,\n.strip:hover .btn--text svg { transform: translateX(4px); }\n.promo a:focus-visible,\n.strip a:focus-visible { outline: none; }\n.promo:has(:focus-visible),\n.strip:has(:focus-visible) { outline: 2px solid var(--text); outline-offset: 2px; }\n.promo__eyebrow { color: var(--text-tertiary); }\n.promo__text { font-weight: var(--w-medium); white-space: normal !important; }\n\n/* ==========================================================================\n   Wireframe page (after Josh's prototype)\n   ========================================================================== */\n.page {\n  display: flex;\n  flex-direction: column;\n  gap: 72px;\n  max-width: 1440px;\n  margin: 0 auto;\n  padding: 56px var(--gutter) 96px;\n}\n.wf-title {\n  margin: 0 0 24px;\n  font-size: 56px;\n  line-height: 1.05;\n  font-weight: var(--w-medium);\n  letter-spacing: -0.01em;\n}\n.wf-line { height: 12px; border-radius: 6px; background: var(--wf); margin: 0 0 12px; }\n.wf-img {\n  min-height: 240px;\n  border: 1.5px solid var(--wf);\n  border-radius: 8px;\n  background: var(--wf-light);\n}\n.wf-img.sm { min-height: 150px; margin-bottom: 18px; }\n.wf-btns { display: flex; gap: 12px; margin-top: 22px; }\n.wf-btns.center { justify-content: center; }\n.wf-btn { width: 132px; height: 42px; border-radius: 6px; background: var(--wf-dark); }\n.wf-btn.ghost { background: none; border: 1.5px solid var(--wf-dark); }\n.wf-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }\n.wf-hero .wf-img { min-height: 340px; }\n.wf-logos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; }\n.wf-logo { height: 36px; border-radius: 6px; background: var(--wf); }\n.wf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }\n.wf-card { border: 1.5px solid var(--wf); border-radius: 10px; padding: 20px; background: #fff; }\n.wf-split { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }\n.wf-split .wf-img { min-height: 300px; }\n.wf-band {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  padding: 48px 24px;\n  border: 1.5px solid var(--wf);\n  border-radius: 12px;\n  background: #fff;\n}\n.wf-band .wf-line { margin-left: auto; margin-right: auto; }\n.wf-footer {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 32px;\n  padding-top: 40px;\n  border-top: 1.5px solid var(--wf);\n}\n\n/* Prototype scaffolding: not part of the design */\n.proto-switch {\n  position: fixed;\n  left: 20px;\n  bottom: 20px;\n  z-index: 90;\n  display: flex;\n  gap: 2px;\n  padding: 4px;\n  background: rgba(17, 17, 17, 0.92);\n  border-radius: 999px;\n  font-size: 12px;\n  line-height: 16px;\n}\n.proto-switch a {\n  padding: 6px 12px;\n  border-radius: 999px;\n  color: rgba(255, 255, 255, 0.7);\n  transition: background-color 0.4s var(--ease), color 0.4s var(--ease);\n}\n.proto-switch a:hover { color: #fff; }\n.proto-switch a[aria-current=\"page\"] { background: #fff; color: #000; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-delay: 0s !important;\n    transition-duration: 0.01ms !important;\n    transition-delay: 0s !important;\n  }\n}\n\n<\/style>\n      <style>\n/* ==========================================================================\n   Mobile navigation prototype. Loads after styles.css and reuses its tokens\n   and menu components (links, product tree, cards).\n   Option 1: the Commerce menu pushes the product bar down. Opening one menu\n             collapses the other.\n   Option 2: the Commerce menu floats below the product bar. Opening it hides the\n             product menu; the product menu can still open above it. The product menu\n             expands in place and pushes the floating menu down.\n   ========================================================================== */\n:root {\n  --app-w: 390px;\n  --m-bar: 56px;\n  --m-dur: 0.6s;\n}\n\nbody { min-width: 0; background: var(--surface-2); }\n\n.m-app {\n  position: relative;\n  max-width: var(--app-w);\n  min-height: 100vh;\n  margin: 0 auto;\n  background: var(--surface);\n  box-shadow: 0 0 0 1px var(--border);\n}\n@media (max-width: 430px) {\n  body { background: var(--surface); }\n  .m-app { box-shadow: none; }\n}\n\n/* ----- Header: where things stick ---------------------------------------- */\n/* Commerce pages: the whole header is sticky.\n   Solution pages: the Commerce bar scrolls away, the product bar stays pinned. */\n.m-head { position: relative; z-index: 70; }\nbody[data-page=\"commerce\"] .m-head { position: sticky; top: 0; }\nbody:not([data-page=\"commerce\"]) .m-head { display: contents; }\nbody[data-variant=\"1\"][data-page=\"commerce\"] .m-head { max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain; }\n\n.m-commerce { position: relative; z-index: 70; background: var(--surface); }\n\n.m-bar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  /* 56px of content plus the 1px rule, so the 44px toggle centers on a whole pixel */\n  height: calc(var(--m-bar) + 1px);\n  padding: 0 16px;\n  background: var(--surface);\n  border-bottom: 1px solid var(--border);\n}\n.m-logo { display: inline-flex; }\n.m-logo img { display: block; height: 20px; width: auto; }\n\n.m-toggle {\n  display: grid;\n  place-items: center;\n  width: 44px;\n  height: 44px;\n  margin-right: -10px;\n  border: 0;\n  border-radius: var(--r-md);\n  background: none;\n  color: var(--text);\n  cursor: pointer;\n  transition: background-color 0.35s var(--ease);\n}\n.m-toggle:active { background: var(--surface-2); }\n.m-toggle__bars { position: relative; width: 20px; height: 16px; }\n/* Two 2px strokes on whole pixels. Only transform animates, and the layer is promoted up front,\n   so the strokes look the same before, during and after the animation. */\n.m-toggle__bars i {\n  position: absolute;\n  top: 7px;\n  left: 0;\n  width: 20px;\n  height: 2px;\ ------------------------------ */\n/* Inline (push down): collapses with a grid-row transition */\n.m-menu {\n  display: grid;\n  grid-template-rows: 0fr;\n  background: var(--surface);\n  visibility: hidden;\n  transition: grid-template-rows var(--m-dur) var(--ease-out), visibility 0s linear var(--m-dur);\n}\n.m-menu.is-open {\n  grid-template-rows: 1fr;\n  visibility: visible;\n  transition: grid-template-rows var(--m-dur) var(--ease-out), visibility 0s;\n}\n.m-menu__inner { min-height: 0; overflow: hidden; }\n.m-product .m-menu.is-open { border-bottom: 1px solid var(--border); }\n.m-commerce .m-menu.is-open { border-bottom: 1px solid var(--border); }\n\n/* Floating (option 2): a card hanging under the product bar */\n.m-anchor { position: relative; z-index: 75; height: 0; }\n.m-anchor .m-menu {\n  display: block;\n  position: absolute;\n  top: 12px;\n  left: 12px;\n  right: 12px;\n  max-height: var(--float-max, calc(100dvh - 148px));\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  border: 1px solid var(--border);\n  border-radius: var(--r-xl);\n  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);\n  opacity: 0;\n  transform: translateY(-8px) scale(0.985);\n  transform-origin: 50% 0;\n  transition: opacity 0.38s var(--ease), transform var(--m-dur) var(--ease-out), visibility 0s linear var(--m-dur);\n}\n.m-anchor .m-menu.is-open {\n  opacity: 1;\n  transform: none;\n  transition: opacity 0.45s var(--ease), transform var(--m-dur) var(--ease-out), visibility 0s;\n}\n.m-anchor .m-menu__inner { overflow: visible; }\n\n/* Scrim: dims the page while any menu is open (the bars and menus sit above it) */\n.m-scrim {\n  position: fixed;\n  top: 0;\n  bottom: 0;\n  left: 50%;\n  z-index: 65;\n  width: min(100%, var(--app-w));\n  transform: translateX(-50%);\n  background: rgba(0, 0, 0, 0.35);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 0.5s var(--ease);\n}\nbody.m-scrim-on .m-scrim { opacity: 1; pointer-events: auto; }\n\n/* ----- Views: a root list tha idth:56%\"><\/div>\n          <div class=\"wf-btns\"><div class=\"wf-btn\"><\/div><div class=\"wf-btn ghost\"><\/div><\/div>\n          <div class=\"wf-img\"><\/div>\n          <div class=\"wf-logos m-logos\"><div class=\"wf-logo\"><\/div><div class=\"wf-logo\"><\/div><div class=\"wf-logo\"><\/div><div class=\"wf-logo\"><\/div><\/div>\n          <div class=\"m-cards\">\n            <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:70%\"><\/div><div class=\"wf-line\" style=\"width:90%\"><\/div><\/div>\n            <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:60%\"><\/div><div class=\"wf-line\" style=\"width:84%\"><\/div><\/div>\n            <div class=\"wf-card\"><div class=\"wf-img sm\"><\/div><div class=\"wf-line\" style=\"width:76%\"><\/div><div class=\"wf-line\" style=\"width:48%\"><\/div><\/div>\n          <\/div>\n          <div class=\"wf-footer m-footer\"><\/div>\n        <\/main>\n\n        <nav class=\"m-switch\" aria-label=\"Prototype controls\">\n          <div class=\"m-switch__row\" role=\"group\" aria-label=\"Page\">\n            <a href=\"#/commerce\" data-route=\"commerce\">Commerce<\/a>\n            <a href=\"#/bigcommerce\" data-route=\"bigcommerce\">BigCommerce<\/a>\n            <a href=\"#/feedonomics\" data-route=\"feedonomics\">Feedonomics<\/a>\n          <\/div>\n          <div class=\"m-switch__row\" role=\"group\" aria-label=\"Menu option\">\n            <button type=\"button\" data-variant=\"1\">1 \u00b7 Push down<\/button>\n            <button type=\"button\" data-variant=\"2\">2 \u00b7 Floating<\/button>\n          <\/div>\n        <\/nav>\n      <\/div>\n\n      <script>\n/* Commerce mobile navigation prototype\n   - Option 1 (push down) / Option 2 (floating): body[data-variant]\n   - Drill-in menus, accordion (option 1) or independent (option 2) product menu\n   - Same routes as desktop: #/<section>  or  #/<section>/<item>\n*/\n(() => {\n  // Review nst view = a.closest('.m-view--sub');\n    const owner = view ? drillRowFor(view.id) : (a.classList.contains('m-row') ? a : null);\n    a.setAttribute('href', `#/${register(section, label, owner, a.dataset.slug)}`);\n  });\n\n  /* ---- Menus ------------------------------------------------------------ */\n  const menus = {\n    commerce: { el: $('#m-commerce-menu'), toggle: $('[data-toggle=\"commerce\"]') },\n    bigcommerce: { el: $('#m-bigcommerce-menu'), toggle: $('[data-product=\"bigcommerce\"]') },\n    feedonomics: { el: $('#m-feedonomics-menu'), toggle: $('[data-product=\"feedonomics\"]') },\n  };\n  const isOpen = (k) => menus[k].el.classList.contains('is-open');\n  const variant = () => body.dataset.variant;\n\n  // Keep the floating card 24px clear of the bottom of the window; it scrolls inside itself past that\n  function fitFloat() {\n    const card = menus.commerce.el;\n    const anchor = card.offsetParent;\n    if (variant() !== '2' || !anchor) { card.style.removeProperty('--float-max'); return; }\n    const top = anchor.getBoundingClientRect().top + card.offsetTop;\n    card.style.setProperty('--float-max', `${Math.max(160, Math.floor(window.innerHeight - top - 24))}px`);\n  }\n\n  // The pinned product block scrolls inside itself. Size it to the room left under its top edge,\n  // otherwise its bottom sits below the window and the last items can't be reached.\n  function fitProduct() {\n    $$('.m-product').forEach((el) => {\n      if (getComputedStyle(el).display === 'none') return;\n      const top = Math.max(0, el.getBoundingClientRect().top);\n      el.style.setProperty('--prod-max', `${Math.max(200, Math.floor(window.innerHeight - top))}px`);\n    });\n  }\n\n  function size(el) {\n    const views = $('.m-views', el);\n    const active = $('.m-view.is-active', el);\n    if (views && active) views.style.height = `${active.offsetHeight}px`;\n  }\n  function resetViews(el) {\n    $$('.m-view', el).forEach((v) => v.classList.toggle('is-active', v.classList.contains('m-view--root')));\n    size(el);\n  }\n  function syncScrim() {\n    body.classList.toggle('m-scrim-on', Object.keys(menus).some(isOpen));\n  }\n\n  function open(k) {\n    const m = menus[k];\n    // Option 1: one menu at a time, the other collapses.\n    // Option 2: opening the Commerce menu hides the product menu; the product menu can still open above it.\n    if (variant() === '1' || k === 'commerce') Object.keys(menus).forEach((o) => { if (o !== k && isOpen(o)) close(o); });\n    size(m.el);\n    m.el.classList.add('is-open');\n    m.toggle.setAttribute('aria-expanded', 'true');\n    syncScrim();\n    fitFloat();\n    fitProduct();\n  }\n  function close(k) {\n    const m = menus[k];\n    if (!isOpen(k)) return;\n    m.el.classList.remove('is-open');\n    m.toggle.setAttribute('aria-expanded', 'false');\n    syncScrim();\n    // Back to the top-level list once it has finished collapsing\n    setTimeout(() => { if (!isOpen(k)) resetViews(m.el); }, 700);\n  }\n  const closeAll = () => Object.keys(menus).forEach(close);\n\n  Object.keys(menus).forEach((k) => {\n    menus[k].toggle.addEventListener('click', () => (isOpen(k) ? close(k) : open(k)));\n  });\n\n  // Drill in / back\n  $$('[data-drill]').forEach((row) => row.addEventListener('click', () => {\n    const el = row.closest('.m-menu');\n    const root = $('.m-view--root', el);\n    const target = document.getElementById(row.dataset.drill);\n    root.classList.remove('is-active');\n    target.classList.add('is-active');\n    size(el);\n    const back = $('[data-back]', target);\n    setTimeout(() => back && back.focus({ preventScroll: true }), 80);\n  }));\n  $$('[data-back]').forEach((btn) => btn.addEventListener('click', () => {\n    const el = btn.closest('.m-menu');\n    const drillBtn = $(`[data-drill=\"${btn.closest('.m-view').id}\"]`, el);\n    resetViews(el);\n    if (drillBtn) setTimeout(() => drillBtn.focus({ preventScroll: true }), 80);\n  }));\n\n  // Choosing anything closes the menus (the hash change does the rest)\n  $$('.m-menu a').forEach((a) => a.addEventListener('click', () => closeAll()));\n  $('[data-scrim]').addEventListener('click', closeAll);\n  document.addEventListener('keydown', (e) => {\n    if (e.key === 'Escape') { const k = Object.keys(menus).find(isOpen); if (k) { e.preventDefault(); close(k); menus[k].toggle.focus(); } }\n  });\n  const resizeAll = () => { Object.values(menus).forEach((m) => size(m.el)); fitFloat(); fitProduct(); };\n  window.addEventListener('resize', resizeAll);\n  window.addEventListener('scroll', () => { fitFloat(); fitProduct(); }, { passive: true });\n  // The card sits under the product menu, so follow it while that expands or collapses\n  if (window.ResizeObserver) { const ro = new ResizeObserver(() => { fitFloat(); fitProduct(); }); $$('.m-product, .m-commerce').forEach((e) => ro.observe(e)); }\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resizeAll);\n\n  /* ---- Option 1 / Option 2 ---------------------------------------------- */\n  const commerceMenu = menus.commerce.el;\n  const slots = { 1: $('[data-slot=\"inline\"]'), 2: $('[data-slot=\"float\"]') };\n  const variantBtns = $$('.m-switch [data-variant]');\n\n  function setVariant(v, { push = true } = {}) {\n    closeAll();\n    body.dataset.variant = v;\n    slots[v].appendChild(commerceMenu);\n    variantBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.variant === v)));\n    syncScrim();\n    resizeAll();\n    if (push) {\n      try {\n        const u = new URL(location.href);\n        u.searchParams.set('v', v);\n        history.replaceState(null, '', u);\n      } catch (e) { /* file:// or sandboxed: the choice just isn't remembered */ }\n    }\n  }\n  variantBtns.forEach((b) => b.addEventListener('click', () => setVariant(b.dataset.variant)));\n  // The review shell (index.html) switches options through this\n  window.__navSetVariant = (v) => setVariant(v === '2' ? '2' : '1', { push: false });\n\n  /* ---- Routing ---------------------------------------------------------- */\n  let lastHash = null;\n  function route() {\n    const m = /^#\\/(commerce|bigcommerce|feedonomics)(?:\\/([a-z0-9-]+))?$/.exec(location.hash);\n    const section = m ? m[1] : 'commerce';\n    const slug = m ? m[2] : null;\n    const key = slug ? `${section}/${slug}` : null;\n\n    let title = SECTIONS[section];\n    let owner = null;\n    if (key) {\n      const page = pages.get(key);\n      title = page ? page.title : titleize(slug);\n      owner = page ? page.owner : null;\n    }\n\n    closeAll();\n    body.dataset.page = section;\n    body.dataset.view = slug || 'home';\n    if (heading) heading.textContent = title;\n    document.title = title;\n\n    $$('.m-row[data-current]').forEach((n) => n.removeAttribute('data-current'));\n    if (section !== 'commerce') { const s = drillRowFor('v-solutions'); if (s) s.setAttribute('data-current', ''); }\n    if (owner) owner.setAttribute('data-current', '');\n\n    switchLinks.forEach((a) => {\n      if (!slug && a.dataset.route === section) a.setAttribute('aria-current', 'page');\n      else a.removeAttribute('aria-current');\n    });\n\n    if (lastHash !== null && lastHash !== location.hash) window.scrollTo({ top: 0, behavior: 'smooth' });\n    lastHash = location.hash;\n    fitProduct();\n  }\n  window.addEventListener('hashchange', route);\n\n  const wanted = window.__BOOT ? window.__BOOT.v : new URLSearchParams(location.search).get('v');\n  const start = wanted === '2' ? '2' : '1';\n  setVariant(start, { push: false });\n  route();\n})();\n\n<\/script>\n      <script>\n/* Review-shell bridge. Only active when a prototype page is loaded inside index.html.\n   Talks to the shell with postMessage (works over http and file://). */\n(() => {\n  if (window.parent === window) return;\n  const root = document.documentElement;\n  const post = (m) => window.parent.postMessage(Object.assign({ src: 'nav-proto' }, m), '*');\n\n  root.classList.add('is-embedded');\n  const st = document.createElement('style');\n  st.textContent = '.is-embedded .proto-switch,.is-embedded .m-switch{display:none!important}' +\n    '.is-embedded.hide-page .page,.is-embedded.hide-page .m-page{visibility:hidden}';\n  document.head.appendChild(st);\n\n  window.addEventListener('message', (e) => {\n    if (e.source !== window.parent) return;\n    const d = e.data;\n    if (!d || d.src !== 'nav-proto') return;\n    switch (d.type) {\n      case 'go': if (typeof d.hash === 'string') location.hash = d.hash; break;\n      case 'back': history.back(); break;\n      case 'forward': history.forward(); break;\n      case 'variant': if (window.__navSetVariant) window.__navSetVariant(d.v); break;\n      case 'vars': Object.entries(d.vars || {}).forEach(([k, v]) => root.style.setProperty(k, v)); break;\n      case 'page': root.classList.toggle('hide-page', d.show === false); break;\n    }\n  });\n\n  // The page lives in a srcdoc frame, where a plain \"#/...\" link resolves against the shell's URL and\n  // would load the shell inside the frame. Handle in-page links here instead.\n  document.addEventListener('click', (e) => {\n    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;\n    const a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n    if (!a) return;\n    e.preventDefault();\n    const h = a.getAttribute('href');\n    if (h && h.length > 1) location.hash = h;\n  });\n\n  window.addEventListener('hashchange', () => post({ type: 'route', hash: location.hash }));\n  post({ type: 'ready', hash: location.hash });\n})();\n\n<\/script>\n    <\/body>\n    <\/html>\n    "};</script>

            ['Hover opens and leaving closes', 'There is no click to open. The menu closes about 200ms after the pointer leaves the buttons and the menu, so the pointer can cross the gap. A mouse click on an open button keeps it open. Touch still taps to open and close. Confirm whether keeping click as an option matters.'],
